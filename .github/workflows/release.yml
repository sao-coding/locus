# Push a tag like v0.2.0 (v0.2.0-rc.1 is published as a prerelease). Publishes ONE portable exe,
# locus-<version>-windows-x64.exe (the Oracle helper sidecar.exe is embedded in it), its .sha256,
# THIRD_PARTY_LICENSES.md and a build provenance attestation.
# The test and build jobs run side by side with a read-only token; only the publish job can write
# to the repo, and it only uploads what the build job made.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # Same settings and cache key as ci.yml's test job, so the tests reuse the cache main saved
    # (rust-cache keys on CARGO_* variables too) instead of compiling everything again. The
    # integration tests need servers and run in ci.yml on main, before the tag is pushed.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches Cargo.toml
        shell: pwsh
        run: ./scripts/ci/check-tag.ps1
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Restore only: a cache saved under a tag can't be used by any later run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - name: test
        run: cargo nextest run --locked --workspace --lib --bins --profile ci

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches Cargo.toml
        shell: pwsh
        run: ./scripts/ci/check-tag.ps1
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The release build's dependencies, saved from main by release-cache.yml: only Locus's own
      # crates compile here. Restore only, like the test job. No CARGO_* settings here: they are part
      # of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      # The sidecar must exist before the app is built: build.rs embeds it.
      - name: build the sidecar
        run: ./sidecar/build.ps1
      - name: build
        run: cargo build --locked --release -p app
      - name: package
        run: |
          $name = "locus-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-x64.exe"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/locus.exe "dist/$name"
          Copy-Item THIRD_PARTY_LICENSES.md dist/THIRD_PARTY_LICENSES.md
          $h = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$h  $name" | Out-File "dist/$name.sha256" -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: lets anyone check with `gh attestation verify` that the exe came from
      # this workflow and commit.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.exe
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.sha256 dist/THIRD_PARTY_LICENSES.md --generate-notes "${args[@]}"
