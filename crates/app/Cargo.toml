[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "locus"
path = "src/main.rs"

[dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
parking_lot.workspace = true
db-core.workspace = true
er-diagram.workspace = true
locus-core.workspace = true
locus-mcp.workspace = true
lsp-types = { version = "=0.97.0", features = ["proposed"] }
anyhow = "=1.0.104"
gpui-kit.workspace = true
tokio.workspace = true
db-redis.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
simplelog.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
# Test and bench hooks (LOCUS_KEYLOG, LOCUS_DEMO_ENV, LOCUS_UNLOCK_SECS, bench scenes). Never in release builds.
dev = ["locus-core/dev"]

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
