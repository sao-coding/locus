# Called by version.yml after it tags v<version> (a tag pushed with GITHUB_TOKEN starts no workflow);
# run it by hand (workflow_dispatch) only to retry a release whose tag already exists. Publishes the
# portable exe locus-<version>-windows-x64.exe (the Oracle helper sidecar.exe is embedded in it),
# the Inno Setup installer locus-<version>-windows-x64-setup.exe (installer/locus.iss; winget uses
# it), a .sha256 and a minisign .minisig (key: minisign.pub) for each, THIRD_PARTY_LICENSES.md and
# a build provenance attestation.
# The test and build jobs run side by side with a read-only token; only the publish job can write
# to the repo, and it only uploads what the build job made.
name: release

on:
  workflow_call:
    inputs:
      version:
        description: Version without the leading v, e.g. 0.2.0 or 0.2.0-rc.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, e.g. 0.2.0 or 0.2.0-rc.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # Same settings and cache key as ci.yml's test job, so the tests reuse the cache main saved
    # (rust-cache keys on CARGO_* variables too) instead of compiling everything again. The
    # integration tests need servers and run in ci.yml on main, before the tag is pushed.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: tag matches Cargo.toml
        shell: pwsh
        run: ./scripts/ci/check-tag.ps1 -Tag $env:TAG
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Restore only: a cache saved under a tag can't be used by any later run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - name: test
        run: cargo nextest run --locked --workspace --lib --bins --profile ci

  build:
    runs-on: windows-latest
    env:
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: tag matches Cargo.toml
        shell: pwsh
        run: ./scripts/ci/check-tag.ps1 -Tag $env:TAG
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The release build's dependencies, saved from main by release-cache.yml: only Locus's own
      # crates compile here. Restore only, like the test job. No CARGO_* settings here: they are part
      # of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      # The sidecar must exist before the app is built: build.rs embeds it.
      - name: build the sidecar
        run: ./sidecar/build.ps1
      - name: build
        run: cargo build --locked --release -p app
      - name: package
        run: |
          $name = "locus-$($env:TAG.TrimStart('v'))-windows-x64.exe"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/locus.exe "dist/$name"
          Copy-Item THIRD_PARTY_LICENSES.md dist/THIRD_PARTY_LICENSES.md
      # Inno Setup 6 comes with the windows-latest image; install it only if a new image drops it.
      - name: installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit 1 }
          }
          & $iscc /Q "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DSourceExe=$PWD\target\release\locus.exe" installer\locus.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: checksums
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ inputs.version }}
    permissions:
      contents: write
      # Build provenance: lets anyone check with `gh attestation verify` that the exe came from
      # this workflow and commit.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0 # tags, for the compare link
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.exe
      # minisign signatures (<exe>.minisig) for Locus's updater and for anyone checking a download
      # against minisign.pub. Only this job sees the key; sign.ps1 fails the release when it is
      # missing or does not match minisign.pub.
      - name: install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign
          minisign -v
      - name: sign
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: ./scripts/ci/sign.ps1 -Dist dist -Version $env:TAG.TrimStart('v')
      # Notes come from .github/release-notes.md + CHANGELOG.md; the virustotal job appends its links.
      - name: release notes
        shell: pwsh
        run: ./scripts/ci/release-notes.ps1 -Version $env:TAG -Out notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.exe dist/*.sha256 dist/*.minisig dist/THIRD_PARTY_LICENSES.md \
            --verify-tag --title "$TAG" --notes-file notes.md "${args[@]}"

  # Scans the published exe (needs the VirusTotal environment, so it lives in its own workflow).
  virustotal:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      tag: v${{ inputs.version }}

  # Comments on (and for a stable release closes) the issues the notes mention as (#N).
  notice:
    needs: publish
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-notice.yml
    with:
      tag: v${{ inputs.version }}
      dry_run: false
