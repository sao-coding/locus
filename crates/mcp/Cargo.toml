[package]
name = "locus-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The built-in MCP server (Streamable HTTP on 127.0.0.1): tools, compact
# result formatting, the per-connection access decision and the HTTP guard
# (token, Origin, Host, body size). No GPUI: the app starts / stops it and
# answers the Production confirmations through `Host`.

[dependencies]
db-core.workspace = true
locus-core.workspace = true
tokio.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio-util = "=0.7.20"
base64 = "=0.22.1"
getrandom = "=0.3.4"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
