name: version

# Knope drives the version; this workflow turns it into a release (the shape of Tessera's version.yml).
#
# Pending changesets on main: open or refresh the release PR `chore(release): <version>` (version
# bump in Cargo.toml and the new CHANGELOG.md section, made by `knope prepare-release` on the
# `release` branch). Merging that PR is the decision to release, whatever its merge title: the next
# run finds no changesets, sees that `v<version>` does not exist yet, tags it and calls release.yml.
#
# release.yml is called, not triggered by the tag: a tag pushed with GITHUB_TOKEN starts no workflow.
#
# Setup: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# PRs opened with GITHUB_TOKEN don't start ci.yml: run it by hand on `release` (Actions > ci > Run
# workflow), or add the optional secret RELEASE_TOKEN (PAT or GitHub App token, contents +
# pull-requests write), which is used instead and makes ci start by itself.
on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: release PR or tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.tag.outputs.release }}
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: changesets pending?
        id: cs
        run: |
          if compgen -G '.changeset/*.md' > /dev/null; then echo "pending=true" >> "$GITHUB_OUTPUT"; fi

      # Changesets pending: (re)build the release branch and its PR.
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.cs.outputs.pending == 'true'
        with:
          version: 0.24.0
      - name: Open or refresh the release PR
        if: steps.cs.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          # Knope treats `minor` as a patch bump while the version is 0.x (0.1.2 -> 0.1.3); here a
          # minor changeset (a feature) bumps the minor version (0.1.2 -> 0.2.0) as it would from 1.0.
          args=()
          cur=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor _ <<< "${cur%%-*}"
          if [ "$major" = 0 ] && grep -qlE '^default:[[:space:]]*minor' .changeset/*.md; then
            args=(--override-version "0.$((minor + 1)).0")
          fi
          knope prepare-release "${args[@]}"
          # knope bumps Cargo.toml only; release.yml builds with --locked, so Cargo.lock must follow.
          cargo update --workspace
          git add Cargo.lock
          git commit --amend --no-edit
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # The new CHANGELOG section is the PR body.
          awk -v v="$version" '/^## /{ if (on) exit; if ($2 == v) { on = 1; next } } on' CHANGELOG.md > "$RUNNER_TEMP/body.md"
          # The token goes on the command line, not into .git/config (the checkout keeps no credentials).
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" release
          title="chore(release): $version"
          n=$(gh pr list --head release --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head release --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      # No changesets: close a stale release PR, then release the version in Cargo.toml if it has no
      # tag yet. Idempotent: a re-run, or a push with nothing to release, finds the tag and stops.
      - name: Close a stale release PR
        if: steps.cs.outputs.pending != 'true'
        run: |
          for n in $(gh pr list --head release --state open --json number --jq '.[].number'); do
            gh pr close "$n" --delete-branch --comment "No changesets left on main; closing."
          done
      - name: Tag the release
        id: tag
        if: steps.cs.outputs.pending != 'true'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "v$version already exists"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$version" -f sha="$SHA" > /dev/null
          echo "tagged v$version at $SHA"
          echo "release=true" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.sha }}

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    uses: ./.github/workflows/release.yml
    # The VirusTotal environment secret only reaches a called job when the caller inherits secrets.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      version: ${{ needs.version.outputs.version }}
