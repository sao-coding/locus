# Release PR, like changesets/action: while .changeset/*.md files exist on main, keep a
# `chore(release): <version>` PR open from the `release` branch (version bump + CHANGELOG.md
# section made by `knope prepare-release`). Merging it makes release.yml tag and publish.
# No changesets: nothing to do, and a stale release PR is closed.
#
# Needs repo setting Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests". PRs opened with GITHUB_TOKEN don't start ci.yml: either run it by hand
# (Actions > ci > Run workflow on `release`) or add the optional RELEASE_TOKEN secret (a PAT or
# GitHub App token with contents + pull-requests write), which this workflow then uses instead.
name: prepare release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    # The merge of the release PR itself needs no new PR.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: changesets present?
        id: cs
        run: |
          if compgen -G '.changeset/*.md' > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: close a stale release PR
        if: steps.cs.outputs.found != 'true'
        run: |
          for n in $(gh pr list --head release --state open --json number --jq '.[].number'); do
            gh pr close "$n" --delete-branch --comment "No changesets left on main; closing."
          done
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.cs.outputs.found == 'true'
        with:
          version: 0.24.0
      - name: prepare the release branch
        if: steps.cs.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          knope prepare-release
          git push --force origin release
      - name: open or update the release PR
        if: steps.cs.outputs.found == 'true'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # The new CHANGELOG section is the body.
          awk -v v="$version" '/^## /{ if (on) exit; if ($2 == v) { on = 1; next } } on' CHANGELOG.md > body.md
          title="chore(release): $version"
          n=$(gh pr list --head release --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --title "$title" --body-file body.md
          else
            gh pr create --base main --head release --title "$title" --body-file body.md
          fi
